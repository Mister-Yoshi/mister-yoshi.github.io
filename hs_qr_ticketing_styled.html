<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HS QR Ticketing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --yellow: #FFC917;
            --yellow-dark: #e6b400;
            --blue: #001a4d;
            --blue-nav: #001233;
            --blue-light: #0054a6;
            --card-bg: #1e2330;
            --bg: #141821;
            --border: #2a2f3d;
            --text: #e8edf5;
            --text-dim: #9aa3b8;
            --radius: 6px;
            --shadow: 0 2px 12px rgba(0,0,0,0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        nav {
            background: var(--blue-nav);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            height: 64px;
            box-shadow: 0 2px 8px rgba(0,0,48,0.18);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 3px solid var(--yellow);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-back {
            background: transparent;
            border: 1.5px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .nav-back:hover {
            border-color: var(--yellow);
            color: var(--yellow);
            background: rgba(255,201,23,0.1);
        }

        .nav-brand {
            color: #ffffff;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .lang-btn {
            background: transparent;
            border: 1.5px solid rgba(255,255,255,0.3);
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 7px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lang-btn:hover {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.7);
        }

        .lang-btn.active {
            background: var(--yellow);
            color: #000;
            border-color: var(--yellow);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 32px;
        }

        .header {
            margin-bottom: 32px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 24px;
        }

        .header h1 {
            font-size: 2rem;
            color: var(--yellow);
            margin-bottom: 8px;
            font-weight: 800;
        }

        .header p {
            color: var(--text-dim);
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
            border-bottom: 2px solid var(--border);
        }

        .tab-btn {
            padding: 14px 24px;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            color: var(--text);
        }

        .tab-btn.active {
            color: var(--yellow);
            border-bottom-color: var(--yellow);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-in;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text);
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="date"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.95rem;
            font-family: 'Outfit', sans-serif;
            background: #0d1117;
            color: var(--text);
            transition: all 0.3s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--yellow);
            box-shadow: 0 0 0 3px rgba(255,201,23,0.1);
            background: #121820;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        button {
            border: none;
            padding: 12px 24px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 700;
            transition: all 0.2s;
            font-family: 'Outfit', sans-serif;
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--yellow) 0%, var(--yellow-dark) 100%);
            color: #000;
            width: 100%;
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255,201,23,0.3);
        }

        .secondary-btn {
            background: transparent;
            color: var(--text-dim);
            border: 1px solid var(--border);
        }

        .secondary-btn:hover {
            border-color: var(--yellow);
            color: var(--yellow);
            background: rgba(255,201,23,0.08);
        }

        .button-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .qr-display {
            text-align: center;
            padding: 30px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-top: 20px;
        }

        #qrcode {
            display: inline-block;
            padding: 20px;
            background: white;
            border-radius: 8px;
            margin: 20px 0;
        }

        #qrcode {
            max-width: 100%;
        }

        #qrcode img {
            display: block;
            width: 300px;
            max-width: 100%;
            height: auto;
            image-rendering: pixelated;
        }

        .qr-label {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .ticket-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .info-item {
            background: #0d1117;
            padding: 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        .info-label {
            color: var(--text-dim);
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .info-value {
            color: var(--yellow);
            font-size: 0.95rem;
            font-weight: 600;
        }

        video {
            width: 100%;
            max-width: 600px;
            border-radius: var(--radius);
            margin: 20px auto;
            display: block;
            border: 1px solid var(--border);
            background: #000;
        }

        canvas {
            display: none;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }

        .modal-close {
            float: right;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
        }

        .modal-close:hover {
            color: var(--yellow);
        }

        .modal-header {
            margin-top: 12px;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: var(--yellow);
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .validation-badge {
            display: inline-block;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 16px;
            animation: slideDown 0.4s ease-out;
        }

        .validation-checkmark {
            display: inline-block;
            margin-right: 8px;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            70% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-icon {
            font-size: 3.5rem;
            text-align: center;
            margin: 20px 0;
            animation: bounce 0.6s ease-out;
        }

        .file-input-wrapper {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .file-input-wrapper button {
            flex: 1;
            min-width: 120px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }
            nav { padding: 0 16px; }
            .header h1 { font-size: 1.5rem; }
            .tab-btn { padding: 12px 16px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-left">
            <button class="nav-back" onclick="goBack()" id="btn-back">← Terug</button>
            <div class="nav-brand" id="brand">🚂 HS Ticketing QR</div>
        </div>
        <div class="nav-right">
            <button class="lang-btn active" onclick="switchLang('nl')" id="lang-nl">NL</button>
            <button class="lang-btn" onclick="switchLang('fr')" id="lang-fr">FR</button>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1 id="title">Treinkaartjes QR Generator</h1>
            <p id="subtitle">Genereer en scan tickets voor Hoggynesische Spoorwegen</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('generate')" id="tab-gen-label">
                📱 <span id="tab-generate">Genereren</span>
            </button>
            <button class="tab-btn" onclick="switchTab('scan')" id="tab-scan-label">
                📸 <span id="tab-scan">Scannen</span>
            </button>
        </div>

        <!-- GENERATE TAB -->
        <div id="generate" class="tab-content active">
            <button class="primary-btn" onclick="fillSampleData()" id="sample-btn" style="margin-bottom: 24px; background: linear-gradient(135deg, rgba(255,201,23,0.3) 0%, rgba(255,201,23,0.1) 100%); color: var(--yellow); border: 1px solid var(--yellow);">📋 Voorbeeldgegevens laden</button>

            <form id="ticketForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="passengerName" id="label-passenger">Passagier</label>
                        <input type="text" id="passengerName" placeholder="Jan Jansen" required>
                    </div>
                    <div class="form-group">
                        <label for="ticketID" id="label-ticket">Ticket ID <span style="color: var(--text-dim); font-weight: 400;" id="ticket-id-label">(auto)</span></label>
                        <input type="text" id="ticketID" placeholder="Wordt automatisch gegenereerd..." readonly style="background: #0a0f1a; cursor: not-allowed;">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="from" id="label-from">Vertrekstation</label>
                        <input type="text" id="from" placeholder="Amsterdam" required>
                    </div>
                    <div class="form-group">
                        <label for="to" id="label-to">Bestemmingstation</label>
                        <input type="text" id="to" placeholder="Rotterdam" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="date" id="label-date">Reisdatum</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label for="trainNumber" id="label-train">Trein nummer</label>
                        <input type="text" id="trainNumber" placeholder="IC1234" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="classType" id="label-class">Klasse</label>
                        <select id="classType" required>
                            <option value="" id="select-class">Selecteer klasse</option>
                            <option value="1">1e klasse</option>
                            <option value="2">2e klasse</option>
                        </select>
                    </div>
                </div>

                <button type="button" class="primary-btn" onclick="generateQR()" id="btn-generate">Genereer QR Code</button>
            </form>

            <div id="qrContainer" style="display: none;">
                <div class="qr-display">
                    <p class="qr-label" id="qr-label">QR Code:</p>
                    <div id="qrcode"></div>
                    <div class="ticket-info">
                        <div class="info-item">
                            <div class="info-label" id="info-passenger">Passagier</div>
                            <div class="info-value" id="info-passenger-val">-</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label" id="info-ticket">Ticket</div>
                            <div class="info-value" id="info-ticket-val">-</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label" id="info-route">Route</div>
                            <div class="info-value" id="info-route-val">-</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label" id="info-train">Trein</div>
                            <div class="info-value" id="info-train-val">-</div>
                        </div>
                    </div>
                </div>
                <div class="button-group">
                    <button class="secondary-btn" onclick="downloadQR()" id="btn-download">💾 Download</button>
                    <button class="secondary-btn" onclick="resetForm()" id="btn-reset">🔄 Nieuw</button>
                </div>
            </div>
        </div>

        <!-- SCAN TAB -->
        <div id="scan" class="tab-content">
            <div class="form-group">
                <label id="label-camera-option">Kies scanmethode:</label>
                <div class="file-input-wrapper">
                    <button type="button" class="secondary-btn" onclick="startCamera()" id="btn-camera">📹 Camera</button>
                    <button type="button" class="secondary-btn" onclick="openFileInput()" id="btn-upload">📁 Afbeelding</button>
                </div>
                <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
            </div>

            <div id="cameraContainer" style="display: none;">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas"></canvas>
                <p style="text-align: center; color: var(--text-dim); margin: 16px 0; font-size: 0.9rem;">
                    <span id="scanning-indicator">🔍 Scanning voor QR codes...</span>
                </p>
                <div class="button-group">
                    <button class="secondary-btn" onclick="stopCamera()" id="btn-stop">Stop</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCAN RESULT MODAL -->
    <div id="scanModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-header">
                <h2 id="modal-title">Ticket Gescanned</h2>
            </div>
            <div class="modal-body" id="modalBody">
            </div>
            <div class="button-group" style="margin-top: 24px;">
                <button class="secondary-btn" onclick="closeModal()" id="modal-close-btn"></button>
            </div>
        </div>
    </div>

    <script>
/* QR-codegenerator (in de pagina, geen externe server nodig).
   Gebaseerd op 'QRCode for JavaScript' (c) 2009 Kazuhiko Arase, MIT-licentie, http://www.d-project.com/ */
var HSQR=(function(){
var QRMode = {
    MODE_NUMBER :       1 << 0,
    MODE_ALPHA_NUM :    1 << 1,
    MODE_8BIT_BYTE :    1 << 2,
    MODE_KANJI :        1 << 3
};

var QRErrorCorrectLevel = {
	L : 1,
	M : 0,
	Q : 3,
	H : 2
};


var QRMaskPattern = {
	PATTERN000 : 0,
	PATTERN001 : 1,
	PATTERN010 : 2,
	PATTERN011 : 3,
	PATTERN100 : 4,
	PATTERN101 : 5,
	PATTERN110 : 6,
	PATTERN111 : 7
};

var QRMath = {

	glog : function(n) {
	
		if (n < 1) {
			throw new Error("glog(" + n + ")");
		}
		
		return QRMath.LOG_TABLE[n];
	},
	
	gexp : function(n) {
	
		while (n < 0) {
			n += 255;
		}
	
		while (n >= 256) {
			n -= 255;
		}
	
		return QRMath.EXP_TABLE[n];
	},
	
	EXP_TABLE : new Array(256),
	
	LOG_TABLE : new Array(256)

};
	
for (var i = 0; i < 8; i++) {
	QRMath.EXP_TABLE[i] = 1 << i;
}
for (var i = 8; i < 256; i++) {
	QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4]
		^ QRMath.EXP_TABLE[i - 5]
		^ QRMath.EXP_TABLE[i - 6]
		^ QRMath.EXP_TABLE[i - 8];
}
for (var i = 0; i < 255; i++) {
	QRMath.LOG_TABLE[QRMath.EXP_TABLE[i] ] = i;
}



function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};






var QRUtil = {

    PATTERN_POSITION_TABLE : [
        [],
        [6, 18],
        [6, 22],
        [6, 26],
        [6, 30],
        [6, 34],
        [6, 22, 38],
        [6, 24, 42],
        [6, 26, 46],
        [6, 28, 50],
        [6, 30, 54],        
        [6, 32, 58],
        [6, 34, 62],
        [6, 26, 46, 66],
        [6, 26, 48, 70],
        [6, 26, 50, 74],
        [6, 30, 54, 78],
        [6, 30, 56, 82],
        [6, 30, 58, 86],
        [6, 34, 62, 90],
        [6, 28, 50, 72, 94],
        [6, 26, 50, 74, 98],
        [6, 30, 54, 78, 102],
        [6, 28, 54, 80, 106],
        [6, 32, 58, 84, 110],
        [6, 30, 58, 86, 114],
        [6, 34, 62, 90, 118],
        [6, 26, 50, 74, 98, 122],
        [6, 30, 54, 78, 102, 126],
        [6, 26, 52, 78, 104, 130],
        [6, 30, 56, 82, 108, 134],
        [6, 34, 60, 86, 112, 138],
        [6, 30, 58, 86, 114, 142],
        [6, 34, 62, 90, 118, 146],
        [6, 30, 54, 78, 102, 126, 150],
        [6, 24, 50, 76, 102, 128, 154],
        [6, 28, 54, 80, 106, 132, 158],
        [6, 32, 58, 84, 110, 136, 162],
        [6, 26, 54, 82, 110, 138, 166],
        [6, 30, 58, 86, 114, 142, 170]
    ],

    G15 : (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0),
    G18 : (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0),
    G15_MASK : (1 << 14) | (1 << 12) | (1 << 10)    | (1 << 4) | (1 << 1),

    getBCHTypeInfo : function(data) {
        var d = data << 10;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) {
            d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) ) );    
        }
        return ( (data << 10) | d) ^ QRUtil.G15_MASK;
    },

    getBCHTypeNumber : function(data) {
        var d = data << 12;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) {
            d ^= (QRUtil.G18 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) ) );    
        }
        return (data << 12) | d;
    },

    getBCHDigit : function(data) {

        var digit = 0;

        while (data !== 0) {
            digit++;
            data >>>= 1;
        }

        return digit;
    },

    getPatternPosition : function(typeNumber) {
        return QRUtil.PATTERN_POSITION_TABLE[typeNumber - 1];
    },

    getMask : function(maskPattern, i, j) {
        
        switch (maskPattern) {
            
        case QRMaskPattern.PATTERN000 : return (i + j) % 2 === 0;
        case QRMaskPattern.PATTERN001 : return i % 2 === 0;
        case QRMaskPattern.PATTERN010 : return j % 3 === 0;
        case QRMaskPattern.PATTERN011 : return (i + j) % 3 === 0;
        case QRMaskPattern.PATTERN100 : return (Math.floor(i / 2) + Math.floor(j / 3) ) % 2 === 0;
        case QRMaskPattern.PATTERN101 : return (i * j) % 2 + (i * j) % 3 === 0;
        case QRMaskPattern.PATTERN110 : return ( (i * j) % 2 + (i * j) % 3) % 2 === 0;
        case QRMaskPattern.PATTERN111 : return ( (i * j) % 3 + (i + j) % 2) % 2 === 0;

        default :
            throw new Error("bad maskPattern:" + maskPattern);
        }
    },

    getErrorCorrectPolynomial : function(errorCorrectLength) {

        var a = new QRPolynomial([1], 0);

        for (var i = 0; i < errorCorrectLength; i++) {
            a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0) );
        }

        return a;
    },

    getLengthInBits : function(mode, type) {

        if (1 <= type && type < 10) {

            // 1 - 9

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 10;
            case QRMode.MODE_ALPHA_NUM  : return 9;
            case QRMode.MODE_8BIT_BYTE  : return 8;
            case QRMode.MODE_KANJI      : return 8;
            default :
                throw new Error("mode:" + mode);
            }

        } else if (type < 27) {

            // 10 - 26

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 12;
            case QRMode.MODE_ALPHA_NUM  : return 11;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 10;
            default :
                throw new Error("mode:" + mode);
            }

        } else if (type < 41) {

            // 27 - 40

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 14;
            case QRMode.MODE_ALPHA_NUM  : return 13;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 12;
            default :
                throw new Error("mode:" + mode);
            }

        } else {
            throw new Error("type:" + type);
        }
    },

    getLostPoint : function(qrCode) {
        
        var moduleCount = qrCode.getModuleCount();
        var lostPoint = 0;
        var row = 0; 
        var col = 0;

        
        // LEVEL1
        
        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {
                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        // LEVEL2

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;       
    }

};

QRRSBlock.getRSBlocks = function(typeNumber, errorCorrectLevel) {
	
	var rsBlock = QRRSBlock.getRsBlockTable(typeNumber, errorCorrectLevel);
	
	if (rsBlock === undefined) {
		throw new Error("bad rs block @ typeNumber:" + typeNumber + "/errorCorrectLevel:" + errorCorrectLevel);
	}

	var length = rsBlock.length / 3;
	
	var list = [];
	
	for (var i = 0; i < length; i++) {

		var count = rsBlock[i * 3 + 0];
		var totalCount = rsBlock[i * 3 + 1];
		var dataCount  = rsBlock[i * 3 + 2];

		for (var j = 0; j < count; j++) {
			list.push(new QRRSBlock(totalCount, dataCount) );	
		}
	}
	
	return list;
};

QRRSBlock.getRsBlockTable = function(typeNumber, errorCorrectLevel) {

	switch(errorCorrectLevel) {
	case QRErrorCorrectLevel.L :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 0];
	case QRErrorCorrectLevel.M :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 1];
	case QRErrorCorrectLevel.Q :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 2];
	case QRErrorCorrectLevel.H :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 3];
	default :
		return undefined;
	}
};


function QRBitBuffer() {
	this.buffer = [];
	this.length = 0;
}

QRBitBuffer.prototype = {

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}
};



function QR8bitByte(data) {
	this.mode = QRMode.MODE_8BIT_BYTE;
	this.data = data;
}

QR8bitByte.prototype = {

	getLength : function() {
		return this.data.length;
	},
	
	write : function(buffer) {
		for (var i = 0; i < this.data.length; i++) {
			// not JIS ...
			buffer.put(this.data.charCodeAt(i), 8);
		}
	}
};

function QRCodeModel(typeNumber, errorCorrectLevel) {
	this.typeNumber = typeNumber;
	this.errorCorrectLevel = errorCorrectLevel;
	this.modules = null;
	this.moduleCount = 0;
	this.dataCache = null;
	this.dataList = [];
}

QRCodeModel.prototype = {
	
	addData : function(data) {
		var newData = new QR8bitByte(data);
		this.dataList.push(newData);
		this.dataCache = null;
	},
	
	isDark : function(row, col) {
		if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) {
			throw new Error(row + "," + col);
		}
		return this.modules[row][col];
	},

	getModuleCount : function() {
		return this.moduleCount;
	},
	
	make : function() {
		// Calculate automatically typeNumber if provided is < 1
		if (this.typeNumber < 1 ){
			var typeNumber = 1;
			for (typeNumber = 1; typeNumber < 40; typeNumber++) {
				var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, this.errorCorrectLevel);

				var buffer = new QRBitBuffer();
				var totalDataCount = 0;
				for (var i = 0; i < rsBlocks.length; i++) {
					totalDataCount += rsBlocks[i].dataCount;
				}

				for (var x = 0; x < this.dataList.length; x++) {
					var data = this.dataList[x];
					buffer.put(data.mode, 4);
					buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
					data.write(buffer);
				}
				if (buffer.getLengthInBits() <= totalDataCount * 8)
					break;
			}
			this.typeNumber = typeNumber;
		}
		this.makeImpl(false, this.getBestMaskPattern() );
	},
	
	makeImpl : function(test, maskPattern) {
		
		this.moduleCount = this.typeNumber * 4 + 17;
		this.modules = new Array(this.moduleCount);
		
		for (var row = 0; row < this.moduleCount; row++) {
			
			this.modules[row] = new Array(this.moduleCount);
			
			for (var col = 0; col < this.moduleCount; col++) {
				this.modules[row][col] = null;//(col + row) % 3;
			}
		}
	
		this.setupPositionProbePattern(0, 0);
		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);
		
		if (this.typeNumber >= 7) {
			this.setupTypeNumber(test);
		}
	
		if (this.dataCache === null) {
			this.dataCache = QRCodeModel.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
		}
	
		this.mapData(this.dataCache, maskPattern);
	},

	setupPositionProbePattern : function(row, col)  {
		
		for (var r = -1; r <= 7; r++) {
			
			if (row + r <= -1 || this.moduleCount <= row + r) continue;
			
			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;
				} else {
					this.modules[row + r][col + c] = false;
				}
			}		
		}		
	},
	
	getBestMaskPattern : function() {
	
		var minLostPoint = 0;
		var pattern = 0;
	
		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);
	
			if (i === 0 || minLostPoint >  lostPoint) {
				minLostPoint = lostPoint;
				pattern = i;
			}
		}
	
		return pattern;
	},
	
	createMovieClip : function(target_mc, instance_name, depth) {
	
		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);
		var cs = 1;
	
		this.make();

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);
					qr_mc.endFill();
				}
			}
		}
		
		return qr_mc;
	},

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}
	},
	
	setupPositionAdjustPattern : function() {
	
		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}
	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCodeModel.PAD0 = 0xEC;
QRCodeModel.PAD1 = 0x11;

QRCodeModel.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCodeModel.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCodeModel.PAD1, 8);
	}

	return QRCodeModel.createBytes(buffer, rsBlocks);
};

QRCodeModel.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};


return {Model:QRCodeModel,Level:QRErrorCorrectLevel};
})();

        let currentLang = 'nl';

        function switchLang(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('lang-' + lang).classList.add('active');
            updateUI();
        }

        function updateUI() {
            const t = translations[currentLang];
            Object.keys(t).forEach(key => {
                const el = document.getElementById(key);
                if (el) {
                    el.textContent = t[key];
                }
            });
            // Update placeholder separately
            document.getElementById('ticketID').placeholder = t['ticket-placeholder'];
            // Update modal close button text
            const modalCloseBtn = document.getElementById('modal-close-btn');
            if (modalCloseBtn) {
                modalCloseBtn.textContent = t['modal-close-btn'];
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.closest('.tab-btn').classList.add('active');
            if (tabName === 'scan') stopCamera();
        }

        function goBack() {
            window.location.href = 'index.html';
        }

        function generateRandomTicketID() {
            const year = new Date().getFullYear();
            const random = Math.floor(Math.random() * 1000000).toString().padStart(6, '0');
            return `HS-${year}-${random}`;
        }

        function fillSampleData() {
            document.getElementById('passengerName').value = 'Anna de Vries';
            document.getElementById('ticketID').value = generateRandomTicketID();
            document.getElementById('from').value = 'Amsterdam Centraal';
            document.getElementById('to').value = 'Rotterdam Centraal';
            document.getElementById('date').value = new Date().toISOString().split('T')[0];
            document.getElementById('trainNumber').value = 'IC1234';
            document.getElementById('classType').value = '1';
            
            setTimeout(() => generateQR(), 100);
        }

        function generateQR() {
            let ticketID = document.getElementById('ticketID').value;
            
            if (!ticketID) {
                ticketID = generateRandomTicketID();
                document.getElementById('ticketID').value = ticketID;
            }

            const passenger = document.getElementById('passengerName').value;
            const from = document.getElementById('from').value;
            const to = document.getElementById('to').value;
            const date = document.getElementById('date').value;
            const train = document.getElementById('trainNumber').value;
            const classType = document.getElementById('classType').value === '1' ? '1st Class' : '2nd Class';

            if (!passenger || !from || !to || !date || !train) {
                alert(currentLang === 'nl' ? 'Vul alle velden in!' : 'Remplissez tous les champs!');
                return;
            }

            const passenger_info = passenger;
            const ticket_info = ticketID;
            const from_info = from;
            const to_info = to;
            const date_info = date;
            const train_info = train;
            const class_info = classType;

            // 1. Find the container
            const qrContainer = document.getElementById('qrcode');
            
            // 2. Clear it
            qrContainer.innerHTML = '';
            
            // 3. Create ticket data
            const ticketData = JSON.stringify({
                passenger: passenger_info,
                ticketID: ticket_info,
                from: from_info,
                to: to_info,
                date: date_info,
                train: train_info,
                class: class_info
            });
            
            // 4. QR-code maken met de generator in deze pagina (geen externe server nodig)
            try {
                qrContainer.appendChild(makeQRImage(ticketData, 300));
            } catch (e) {
                console.error('QR-code maken mislukt:', e);
                qrContainer.textContent = currentLang === 'nl' ? 'QR-code maken mislukt.' : 'Échec de la création du code QR.';
            }

            document.getElementById('qrContainer').style.display = 'block';

            document.getElementById('info-passenger-val').textContent = passenger_info;
            document.getElementById('info-ticket-val').textContent = ticket_info;
            document.getElementById('info-route-val').textContent = `${from_info} → ${to_info}`;
            document.getElementById('info-train-val').textContent = `${train_info} (${class_info})`;
        }

        // Tekst als UTF-8 in een QR-code (foutcorrectie H), getekend als scherpe afbeelding
        function makeQRImage(text, size) {
            const q = new HSQR.Model(-1, HSQR.Level.H);
            q.addData(unescape(encodeURIComponent(text)));
            q.make();
            const n = q.getModuleCount(), scale = Math.max(4, Math.ceil(size * 2 / n)), c = document.createElement('canvas');
            c.width = c.height = n * scale;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
            ctx.fillStyle = '#000000';
            for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) ctx.fillRect(k * scale, r * scale, scale, scale);
            const img = document.createElement('img');
            img.src = c.toDataURL('image/png');
            img.alt = 'QR';
            return img;
        }

        function downloadQR() {
            const img = document.querySelector('#qrcode img');
            if (img) {
                const link = document.createElement('a');
                link.href = img.src;
                link.download = `HS-ticket-${document.getElementById('ticketID').value}.png`;
                link.click();
            }
        }

        function resetForm() {
            document.getElementById('ticketForm').reset();
            document.getElementById('qrContainer').style.display = 'none';
        }

        let videoStream = null;
        let scanningActive = false;
        let nativeBusy = false, nativeDet;
        function nativeQR() {
            if (nativeDet === undefined) {
                try { nativeDet = ('BarcodeDetector' in window) ? new BarcodeDetector({ formats: ['qr_code'] }) : null; } catch (e) { nativeDet = null; }
            }
            return nativeDet;
        }

        async function startCamera() {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                
                const video = document.getElementById('video');
                video.srcObject = videoStream;
                document.getElementById('cameraContainer').style.display = 'block';
                
                // Start scanning once video is ready
                video.onloadedmetadata = () => {
                    scanningActive = true;
                    continuousScan();
                };
                
                console.log('✓ Camera started');
            } catch (error) {
                console.error('Camera error:', error);
                alert(currentLang === 'nl' ? 'Camera niet beschikbaar.' : 'Caméra non disponible.');
            }
        }

        function continuousScan() {
            if (!scanningActive) return;
            
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            
            if (!canvas || !video) return;
            
            try {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                // jsQR als die geladen is, anders de ingebouwde QR-lezer van de telefoon
                if (typeof jsQR !== 'undefined' && jsQR) {
                    const code = jsQR(imageData.data, canvas.width, canvas.height);
                    if (code) {
                        scanningActive = false;
                        showTicket(code.data);
                        return;
                    }
                } else if (nativeQR() && !nativeBusy) {
                    nativeBusy = true;
                    nativeQR().detect(canvas).then(r => {
                        nativeBusy = false;
                        if (r.length && scanningActive) { scanningActive = false; showTicket(r[0].rawValue); }
                        else if (scanningActive) setTimeout(continuousScan, 200);
                    }).catch(() => { nativeBusy = false; if (scanningActive) setTimeout(continuousScan, 400); });
                    return;
                }
            } catch (err) {
                // Silently continue
            }
            
            requestAnimationFrame(continuousScan);
        }

        function stopCamera() {
            scanningActive = false;
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                document.getElementById('cameraContainer').style.display = 'none';
            }
        }

        function captureFrame() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);

            decodeQR(canvas);
        }

        function openFileInput() {
            document.getElementById('imageInput').click();
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.getElementById('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        decodeQR(canvas);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function decodeQR(canvas) {
            const notFound = () => alert(currentLang === 'nl' ? 'Geen QR code gevonden.' : 'Aucun code QR trouvé.');
            if (typeof jsQR !== 'undefined' && jsQR) {
                const ctx = canvas.getContext('2d');
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, canvas.width, canvas.height);
                code ? showTicket(code.data) : notFound();
            } else if (nativeQR()) {
                nativeQR().detect(canvas).then(r => r.length ? showTicket(r[0].rawValue) : notFound()).catch(notFound);
            } else {
                alert(currentLang === 'nl' ? 'De QR-lezer kon niet laden. Controleer je verbinding.' : 'Le lecteur QR n’a pas pu se charger. Vérifiez votre connexion.');
            }
        }

        function escHTML(v) {
            return String(v == null ? '' : v).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        function showTicket(text) {
            const code = { data: text };
            {
                try {
                    const raw = JSON.parse(code.data);
                    const data = {};
                    Object.keys(raw || {}).forEach(k => data[k] = escHTML(raw[k]));
                    
                    const modalBody = document.getElementById('modalBody');
                    const modalTitle = document.getElementById('modal-title');
                    
                    // Taal-bewuste titels
                    modalTitle.textContent = currentLang === 'nl' 
                        ? translations.nl['modal-title-valid']
                        : translations.fr['modal-title-valid'];
                    
                    // Validatie badge
                    const validationBadge = currentLang === 'nl'
                        ? `<div class="validation-badge"><span class="validation-checkmark">✓</span>${translations.nl['modal-validation-badge']}</div>`
                        : `<div class="validation-badge"><span class="validation-checkmark">✓</span>${translations.fr['modal-validation-badge']}</div>`;
                    
                    // Validatie bericht
                    const validationMessage = currentLang === 'nl'
                        ? translations.nl['modal-validation-message']
                        : translations.fr['modal-validation-message'];
                    
                    const html = `
                        <div class="success-icon">✅</div>
                        ${validationBadge}
                        <p style="color: var(--text-dim); margin-bottom: 20px; text-align: center;">${validationMessage}</p>
                        <div class="ticket-info">
                            <div class="info-item">
                                <div class="info-label">${translations[currentLang]['info-passenger']}</div>
                                <div class="info-value">${data.passenger}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">${translations[currentLang]['info-ticket']}</div>
                                <div class="info-value">${data.ticketID}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">${translations[currentLang]['info-route']}</div>
                                <div class="info-value">${data.from} → ${data.to}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">📅</div>
                                <div class="info-value">${data.date}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">${translations[currentLang]['info-train']}</div>
                                <div class="info-value">${data.train}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">🎫</div>
                                <div class="info-value">${data.class}</div>
                            </div>
                        </div>
                    `;
                    modalBody.innerHTML = html;
                    document.getElementById('scanModal').classList.add('active');
                } catch(e) {
                    const modalBody = document.getElementById('modalBody');
                    const modalTitle = document.getElementById('modal-title');
                    
                    modalTitle.textContent = currentLang === 'nl' 
                        ? translations.nl['modal-title-scanned']
                        : translations.fr['modal-title-scanned'];
                    
                    modalBody.innerHTML = `<p style="color: var(--text); word-break: break-all;">${escHTML(code.data)}</p>`;
                    document.getElementById('scanModal').classList.add('active');
                }
            }
        }

        function closeModal() {
            document.getElementById('scanModal').classList.remove('active');
            // Resume scanning if camera is still active
            if (videoStream && videoStream.getTracks().some(track => track.readyState === 'live')) {
                scanningActive = true;
                continuousScan();
            }
        }

        document.getElementById('date').valueAsDate = new Date();
        updateUI();
    </script>
