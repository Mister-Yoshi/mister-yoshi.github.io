@keyframes bar2{0%{transform:skewX(-18deg) translateX(-170%)}42%,52%{transform:skewX(-18deg) translateX(0)}100%{transform:skewX(-18deg) translateX(170%)}}

fr:{brand:"CFH",sub:"Chemin de Fer Hoggynesiéns",off:"Pas en service",on:"En service",since:"Montée en gare de {s} à {t}",h1:"Prise de service",l1:"Numéro de personnel",l2:"Nom",l3:"Fonction",l4:"Gare de montée",l6:"Heure de montée",l7:"Changements déjà effectués (facultatif)",bin:"Prendre son service",go:"En service !",bye:"Service terminé",
fn:["Conducteur de train","Chef de train","Employé de gare","Autre"],err:"Veuillez remplir tous les champs.",h2:"Changements de train",l5:"Nouveau train (facultatif, p. ex. IC 2314)",bov:"Changement de train effectué",bpz:"Démarrer la pause (longue correspondance)",bpe:"Terminer la pause",pz:"Pause",bout:"Fin de service",none:"Aucun changement de train",ovl:"Changement",tot:"Total",hello:"{n} ({f}) · n° {nr}",conf:"Touchez à nouveau pour terminer",done:"Service terminé. Changements de train : {c} · temps de travail {d}",ft:"Correspondances pendant ce service",mans:"Saisir un train manuellement",lgh:"Journal",bnb:"📍 Trains à ma position",gps:"Localisation en cours…",gno:"Position indisponible. Activez le GPS et autorisez l’accès.",near:"Gare la plus proche : {s} ({d})",ld:"Chargement des départs…",nod:"Aucun départ trouvé.",ner:"Pas de données en direct de NS.",pick:"Touchez un train pour changer",tr:"voie",xx:"supprimé",at:"à {s}",home:"Menu principal"}
};
let cf=0,lang="nl",S={on:false,t:0,nr:"",nm:"",fn:0,s0:"",log:[]};
const $=id=>document.getElementById(id);
try{const x=JSON.parse(localStorage.getItem("hsdienst")||"null");if(x){S=Object.assign(S,x.S);lang=x.lang||"nl"}}catch(e){}
function save(){try{localStorage.setItem("hsdienst",JSON.stringify({S,lang}))}catch(e){}}
const f=(s,o)=>s.replace(/\{(\w+)\}/g,(m,k)=>o[k]);
const hm=t=>new Date(t).toLocaleTimeString(lang==="fr"?"fr-BE":"nl-NL",{hour:"2-digit",minute:"2-digit"});
const dur=ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function render(){
const t=T[lang];document.documentElement.lang=lang;document.title=t.brand+" – "+(lang==="fr"?"Service":"In dienst");
$("brand").textContent=t.brand;$("sub").textContent=t.sub;
$("bn").classList.toggle("on",lang==="nl");$("bf").classList.toggle("on",lang==="fr");
["h1","l1","l2","l3","l4","l6","l7","h2","l5"].forEach(k=>$(k).textContent=t[k]);
$("bin").textContent=t.bin;$("bnb").textContent=t.bnb;$("mans").textContent=t.mans;$("lgh").textContent=t.lgh;$("bnb").disabled=!!S.p;$("hmb").setAttribute("aria-label",t.home);$("bov").textContent=t.bov;$("bpz").textContent=S.p?t.bpe:t.bpz;$("bov").disabled=$("pl").disabled=$("mn").disabled=!!S.p;$("bout").textContent=t.bout;
const sel=$("fn"),cur=S.on?S.fn:sel.selectedIndex>=0?sel.selectedIndex:0;
sel.innerHTML=t.fn.map((x,i)=>"<option value='"+i+"'>"+x+"</option>").join("");sel.value=cur;
$("st").classList.toggle("on",S.on);$("st").classList.toggle("pz",!!S.p);$("rail").className="rail"+(S.on?(S.p?" pz":" go"):"");$("stt").textContent=S.on?(S.p?t.pz:t.on):t.off;
$("fm").classList.toggle("hid",S.on);$("ov").classList.toggle("hid",!S.on);$("uit").classList.toggle("hid",!S.on);
$("stm").textContent=S.on?f(t.since,{t:hm(S.t),s:S.s0})+" · "+f(t.hello,{n:S.nm,f:t.fn[S.fn],nr:S.nr}):"";
if(S.on){$("t0").value="";$("c0").value=""}else if(!$("t0").value){const d=new Date();$("t0").value=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
{const v=String(S.log.filter(e=>!e.pz).length),el=$("n");if(el.textContent!==v){el.textContent=v;el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump")}}
$("lg").innerHTML=S.log.length?(()=>{let c=0;return S.log.map(e=>e.pz?"<li class='p'><i>⏸</i><span><b>"+t.pz+"</b><small>"+hm(e.t)+" · "+Math.max(1,Math.round(e.pz/60000))+" min</small></span></li>":"<li><i>"+(++c)+"</i><span><b>"+(e.s?e.s.replace(/</g,"&lt;"):t.ovl+" "+c)+"</b><small>"+hm(e.t)+(e.at?" · "+f(t.at,{s:e.at.replace(/</g,"&lt;")}):"")+"</small></span></li>").reverse().slice(0,40).join("")})():"<li><span class='mu'>"+t.none+"</span></li>";
tick()}
function fx(rev,t,s){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const e=$("fx"),m=$("tm");e.classList.remove("show","rev");void e.offsetWidth;$("fxt").textContent=t;$("fxs").textContent=s;if(rev)e.classList.add("rev");e.classList.add("show");m.classList.remove("pop");void m.offsetWidth;m.classList.add("pop");clearTimeout(fx.h);fx.h=setTimeout(()=>e.classList.remove("show"),3400)}
function tick(){if(document.hidden)return;const n=Date.now(),pt=(S.pt||0)+(S.p?n-S.p:0);$("tm").textContent=S.on?dur(n-S.t-pt):"00:00:00";$("pb").textContent=S.on&&S.p?T[lang].pz+" "+dur(n-S.p):""}
setInterval(tick,1000);document.addEventListener("visibilitychange",()=>{document.documentElement.classList.toggle("bg",document.hidden);tick()});

/* ---------- GPS + NS: treinen op je locatie ---------- */
const API="https://hs-trein.mitchell-middelbosch.workers.dev/";
const esc=x=>String(x==null?"":x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let STN=null,NB=[];
function stns(){if(STN)return Promise.resolve(STN);try{const c=JSON.parse(localStorage.getItem("hsdienst_st")||"null");if(c&&Date.now()-c.t<7*864e5&&c.d.length&&c.d[0].la!=null){STN=c.d;return Promise.resolve(STN)}}catch(e){}
 return fetch(API+"?stations=1").then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{STN=(j.stations||[]).filter(x=>x.la&&x.lo);try{localStorage.setItem("hsdienst_st",JSON.stringify({t:Date.now(),d:STN}))}catch(e){}return STN})}
function km(a,b,c,d){const R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function dst(k){return k<1?Math.round(k*1000)+" m":k.toFixed(1).replace(".",",")+" km"}
function here(){return new Promise((ok,no)=>{if(!navigator.geolocation)return no();navigator.geolocation.getCurrentPosition(p=>ok(p.coords),no,{enableHighAccuracy:true,timeout:12000,maximumAge:30000})})}
function nearest(){return Promise.all([here(),stns()]).then(([c,L])=>{let b=null,bd=1e9;L.forEach(s=>{const d=km(c.latitude,c.longitude,s.la,s.lo);if(d<bd){bd=d;b=s}});if(!b)throw 0;return{s:b,d:bd}})}
$("g0").onclick=()=>{const t=T[lang];$("gi0").textContent=t.gps;nearest().then(r=>{$("s0").value=r.s.n;$("gi0").textContent=f(t.near,{s:r.s.n,d:dst(r.d)})}).catch(()=>{$("gi0").textContent=t.gno})};
$("bnb").onclick=()=>{const t=T[lang];$("nbl").innerHTML="";$("nbi").textContent=t.gps;
 nearest().then(r=>{$("nbi").textContent=f(t.near,{s:r.s.n,d:dst(r.d)})+" · "+t.ld;
  return fetch(API+"?station="+encodeURIComponent(r.s.c)).then(x=>{if(!x.ok)throw 1;return x.json()}).then(j=>{
   const now=Date.now();NB=((j.payload&&j.payload.departures)||[]).filter(d=>new Date(d.actualDateTime).getTime()>now-6e4).slice(0,8).map(d=>Object.assign(d,{_st:r.s.n}));
   $("nbi").textContent=f(t.near,{s:r.s.n,d:dst(r.d)})+(NB.length?" · "+t.pick:"");
   $("nbl").innerHTML=NB.length?NB.map((d,i)=>{const p=d.product||{},l=Math.round((new Date(d.actualDateTime)-new Date(d.plannedDateTime))/6e4),tr=d.actualTrack||d.plannedTrack||"",st=d.stock&&d.stock.parts&&d.stock.parts.length?d.stock.parts.join(" + "):"";
    return "<li><button type='button' data-i='"+i+"'"+(d.cancelled?" disabled":"")+"><b class='nt'>"+hm(d.plannedDateTime)+(l>0?"<s>+"+l+"</s>":"")+"</b><span class='nd'><b>"+esc((p.categoryCode||"")+" "+(p.number||""))+"</b> → "+esc(d.direction)+(st?"<small>"+esc(st)+"</small>":"")+(d.cancelled?"<small class='x'>"+t.xx+"</small>":"")+"</span>"+(tr?"<span class='nk'>"+esc(tr)+"</span>":"")+"</button></li>"}).join(""):"<li class='mu'>"+t.nod+"</li>"})})
 .catch(e=>{$("nbi").textContent=e===1?t.ner:t.gno})};
$("nbl").onclick=e=>{const b=e.target.closest("button[data-i]");if(!b||S.p)return;const d=NB[+b.dataset.i],p=d.product||{};
 S.log.push({t:Date.now(),s:((p.categoryCode||"")+" "+(p.number||"")).trim()+" → "+d.direction,at:d._st});$("nbl").innerHTML="";$("nbi").textContent="";save();render()};
$("bn").onclick=()=>{lang="nl";save();render()};$("bf").onclick=()=>{lang="fr";save();render()};
$("bin").onclick=()=>{const nr=$("nr").value.trim(),nm=$("nm").value.trim(),s0=$("s0").value.trim();
if(!nr||!nm||!s0||!$("t0").value){$("er").textContent=T[lang].err;return}
$("er").textContent="";const tv=$("t0").value.split(":"),d=new Date();d.setHours(+tv[0],+tv[1],0,0);if(d>Date.now()+60000)d.setDate(d.getDate()-1);$("sm").textContent="";S={on:true,t:d.getTime(),nr,nm,fn:+$("fn").value,s0,log:Array.from({length:Math.min(99,Math.max(0,+$("c0").value||0))},()=>({t:d.getTime(),s:""})),p:0,pt:0};save();render();fx(0,T[lang].go,s0+" · "+hm(S.t))};
$("bov").onclick=()=>{S.log.push({t:Date.now(),s:$("s1").value.trim()});$("s1").value="";save();render()};
$("pl").onclick=()=>{S.log.push({t:Date.now(),s:""});save();render()};
$("mn").onclick=()=>{for(let i=S.log.length-1;i>=0;i--)if(!S.log[i].pz){S.log.splice(i,1);break}save();render()};
$("bpz").onclick=()=>{if(S.p){const d=Date.now()-S.p;S.pt=(S.pt||0)+d;S.log.push({t:S.p,pz:d});S.p=0}else S.p=Date.now();save();render()};
$("bout").onclick=()=>{if(!cf){cf=1;$("bout").textContent=T[lang].conf;setTimeout(()=>{cf=0;render()},5000);return}cf=0;
$("sm").textContent=(f(T[lang].done,{c:S.log.filter(e=>!e.pz).length,d:dur(Date.now()-S.t-(S.pt||0)-(S.p?Date.now()-S.p:0))}));S={on:false,t:0,nr:"",nm:"",fn:0,s0:"",log:[],p:0,pt:0};save();render();fx(1,T[lang].bye,$("sm").textContent)};
