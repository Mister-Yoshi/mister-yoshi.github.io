name: Wear OS app bouwen

on:
  push:
    paths:
      - "wearos/**"
      - ".github/workflows/wearos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wearos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Stationslijst met coördinaten ophalen (NS via de Worker)
        run: |
          curl -sf -m 30 -H "Origin: https://mister-yoshi.github.io" "https://hs-trein.mitchell-middelbosch.workers.dev/?stations=1" -o /tmp/st.json || true
          python3 - <<'PY'
          import json,os
          try:
              j=json.load(open('/tmp/st.json'))
              rows=[f"{s['n']}\t{s['la']}\t{s['lo']}" for s in j.get('stations',[]) if s.get('la') and s.get('lo')]
          except Exception as e:
              rows=[];print('geen lijst:',e)
          if len(rows)>50:
              open('app/src/main/assets/stations.txt','w').write("\n".join(rows)+"\n")
          print('stations:',len(rows))
          PY
      - name: APK bouwen
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: hs-in-dienst-wearos
          path: wearos/app/build/outputs/apk/release/*.apk
      - name: APK in branch wear-apk zetten
        if: github.ref == 'refs/heads/HS-Look'
        working-directory: .
        run: |
          mkdir -p /tmp/out && cp wearos/app/build/outputs/apk/release/app-release.apk /tmp/out/HS-In-dienst-WearOS.apk
          cd /tmp/out && git init -q && git checkout -q -b wear-apk
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add HS-In-dienst-WearOS.apk && git commit -qm "APK ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" wear-apk
